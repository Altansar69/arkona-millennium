[plugin]
id = "com.arkona.releases"
name = "Arkona Releases"
version = "1.4.19"
author = "Arkona"
description = "Shows Arkona releases and NFOs on Steam game pages."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix = "BCK"
frontend_prefix = "FRT"
webview_prefix = "WEB"

[patches]
debug = false
